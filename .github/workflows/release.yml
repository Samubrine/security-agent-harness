name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and test dependencies
        run: python -m pip install ".[dev]"

      - name: Run the test suite
        run: python -m pytest

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Verify version metadata and release tag
        shell: python
        run: |
          import os
          import pathlib
          import re
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          init_text = pathlib.Path("src/harness/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.MULTILINE)
          if not match or match.group(1) != version:
              raise SystemExit("pyproject.toml and harness.__version__ must contain the same version")

          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              tag = os.environ["GITHUB_REF_NAME"]
              if tag != f"v{version}":
                  raise SystemExit(f"release tag {tag!r} must match project version v{version}")

      - name: Build wheel and source archive
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/
          if-no-files-found: error

  install:
    name: Install on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the built distribution
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist

      - name: Install the wheel
        shell: python
        run: |
          import glob
          import subprocess
          import sys

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          subprocess.check_call([sys.executable, "-m", "pip", "install", wheels[0]])

      - name: Check the installed command and bundled resources
        run: |
          harness --help
          python -c "from importlib.metadata import version; import harness; from harness.report.build import TEMPLATES; from harness.skills.loader import load_skill; assert harness.__version__ == version('security-agent-harness'); assert load_skill('port_scan').name == 'port_scan'; assert (TEMPLATES / 'report.md.j2').is_file()"

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified distribution
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
